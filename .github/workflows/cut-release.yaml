name: Cut Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  cut-release:
    uses: cloudoperators/common/.github/workflows/shared-release.yaml@main
    permissions:
      contents: write
    with:
      bump: ${{ inputs.bump }}
      makefile-path: Makefile
    secrets:
      release-token: ${{ secrets.GITHUB_TOKEN }}
